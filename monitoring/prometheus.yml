global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'host.docker.internal:9093'
scrape_configs:
  - job_name: 'user-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'rabbitmq'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['rabbitmq-standalone-lab3:15692']